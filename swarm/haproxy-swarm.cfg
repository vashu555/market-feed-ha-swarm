# HAProxy for the Swarm stack (stack name must be "market").
# NODE_NAME comes from the stack file ({{.Node.Hostname}}).
global
    log stdout format raw local0
    maxconn 5000

defaults
    log global
    mode http
    option httplog
    option dontlognull
    option forwardfor
    timeout http-request 10s
    timeout connect 3s
    timeout client 60s
    timeout server 60s
    timeout queue 10s
    timeout tunnel 1h

# Docker's embedded DNS. tasks.market_api returns one A record per running API task,
# on either VM, and changes as Swarm moves tasks around.
resolvers docker
    nameserver docker_dns 127.0.0.11:53
    resolve_retries 3
    timeout resolve 1s
    timeout retry 1s
    hold valid 5s
    hold obsolete 5s
    accepted_payload_size 8192

frontend market_front
    bind :8080
    acl lb_health path -i /lb-health
    # 200 only if this HAProxy can reach at least one healthy API (use for DNS failover checks).
    http-request return status 200 content-type text/plain string "ok" if lb_health { nbsrv(api_pool) gt 0 }
    http-request return status 503 content-type text/plain string "no-backends" if lb_health
    http-response set-header X-LB-Node "${NODE_NAME}"
    default_backend api_pool

backend api_pool
    balance roundrobin
    option httpchk
    http-check send meth GET uri /health ver HTTP/1.1 hdr Host localhost
    http-check expect status 200
    default-server inter 2s fall 3 rise 2 check resolvers docker init-addr none resolve-prefer ipv4
    # 6 slots: 4 APIs + room for start-first rolling updates.
    server-template api 6 tasks.market_api:8000

listen statistics
    bind :8404
    mode http
    stats enable
    stats uri /stats
    stats refresh 5s
    stats hide-version
